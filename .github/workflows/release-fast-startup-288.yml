name: Verify fast startup release
on:
  push:
    branches: [codex/fast-startup-288]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Apply and verify tested release
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .github/release-fast-startup-288.patch.gz.b64 | gzip --decompress > /tmp/fast-startup-288.patch
          git apply --check /tmp/fast-startup-288.patch
          git apply /tmp/fast-startup-288.patch
          node --check app.js
          node --check app-start.js
          node --check deferred-feature.js
          node --check selection-returning-availability.js
          node --check selection-evidence-snapshot.js
          node Scripts/build-demo.mjs
          node Scripts/build-demo.mjs --check
          npm ci --ignore-scripts --no-audit --no-fund
          node --test Tests/app_startup_test.cjs Tests/demo_navigation_integration_test.cjs Tests/demo_roles_integration_test.cjs Tests/selection_returning_test.cjs Tests/selection_returning_quiet_test.cjs Tests/selection_analysis_on_demand_test.cjs Tests/selection_evidence_snapshot_test.cjs Tests/selection_board_responsiveness_test.cjs Tests/selection_evidence_test.mjs Tests/selection_evidence_ui_test.cjs Tests/selection_history_test.cjs Tests/selection_current_week_evidence_test.cjs Tests/selection_team_moves_test.cjs Tests/selection_team_moves_demo_test.cjs Tests/password_flow_test.mjs Tests/password_entry_ui_test.cjs Tests/domain_routing_test.mjs Tests/domain_integrations_test.mjs Tests/selection_room_ui_test.mjs Tests/selection_room_scope_test.cjs Tests/selection_room_recovery_test.mjs Tests/selection_group_page_test.mjs Tests/selection_group_permissions_ui_test.mjs Tests/playcricket_connection_ui_test.mjs Tests/selection_match_roles_ui_test.cjs Tests/mirelion_assist_demo_test.cjs
          git add -- AGENTS.md Demo/build-manifest.json Demo/fixtures.js Demo/journeys.js Reviews/2026-10-28-fast-startup-288.md Scripts/build-demo.mjs Tests/app_startup_test.cjs Tests/demo_navigation_integration_test.cjs Tests/selection_evidence_snapshot_test.cjs app-start.js app.html app.js deferred-feature.js demo.html help-catalogue.js player-fielding.js season-stats-panel.js selection-evidence-snapshot.js selection-evidence-ui.js selection-evidence.js selection-returning-availability.js selection-returning.js social-font-fallback.js
          git rm .github/release-fast-startup-288.patch.gz.b64 .github/workflows/release-fast-startup-288.yml
          git diff --cached --check
          test "$(git write-tree)" = "53543da734d4d34ed83dc6da554b97fafb3c838b"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Build verified fast startup release 0.8.62.288"
          git push origin HEAD:refs/heads/codex/fast-startup-288
