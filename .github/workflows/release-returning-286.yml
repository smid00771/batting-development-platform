name: Verify available-again release
on:
  push:
    branches: [codex/selection-returning-reminders-286]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Apply and verify tested release
        shell: bash
        run: |
          set -euo pipefail
          git apply --check .github/release-returning-286.patch
          git apply .github/release-returning-286.patch
          node --check app.js
          node --check selection-returning.js
          node Scripts/build-demo.mjs
          node Scripts/build-demo.mjs --check
          npm ci --ignore-scripts --no-audit --no-fund
          node --test Tests/selection_returning_quiet_test.cjs Tests/selection_returning_test.cjs Tests/selection_board_responsiveness_test.cjs Tests/selection_emergency_ui_test.cjs Tests/selection_meeting_ui_test.cjs
          node --test --test-name-pattern='the complete demo opens on the selector board' Tests/demo_navigation_integration_test.cjs
          git add AGENTS.md Database/selection_returning_context.sql Demo/build-manifest.json Demo/current-fixtures.js Reviews/2026-10-27-selection-returning-286.md Tests/selection_returning_context_database_test.sql Tests/selection_returning_quiet_test.cjs app-design.css app.html app.js demo.html selection-returning.js supabase/migrations/20261027122822_selection_returning_availability_context.sql
          git rm .github/release-returning-286.patch .github/workflows/release-returning-286.yml
          git diff --cached --check
          test "$(git write-tree)" = "4f73beb2b8c3c3aaba5889cc53363a413e1585aa"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Build verified available-again release 0.8.62.286"
          git push origin HEAD:refs/heads/codex/selection-returning-reminders-286
