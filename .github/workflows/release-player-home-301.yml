name: Verify player Home and social storage release
on:
  push:
    branches: ["codex/player-home-301"]
    paths: [".github/release-player-home-301.patch.gz.b64", ".github/workflows/release-player-home-301.yml"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply reviewed source patch
        run: base64 --decode .github/release-player-home-301.patch.gz.b64 | gzip -d | git apply --binary
      - run: npm ci --ignore-scripts
      - name: Verify source and delivered demo
        run: |
          node --check app.js
          node --check social-workspace.js
          node --check social-awards.js
          node --check social-publishing.js
          node Scripts/build-demo.mjs --check
          node --test Tests/player_home_onboarding_test.cjs Tests/social_storage_delete_test.mjs Tests/social_large_photo_test.cjs Tests/signup_entry_flow_test.cjs Tests/demo_navigation_integration_test.cjs Tests/demo_roles_integration_test.cjs Tests/navigation_precision_test.cjs Tests/social_awards_publishing_test.mjs Tests/social_awards_recovery_test.mjs Tests/publication_validation_demo_test.cjs Tests/selection_analysis_on_demand_test.cjs Tests/selection_returning_quiet_test.cjs
      - name: Commit verified source
        run: |
          git add 'AGENTS.md' 'Demo/build-manifest.json' 'Demo/current-fixtures.js' 'Demo/journeys.js' 'Reviews/2026-10-29-player-home-and-social-storage-301.md' 'Tests/demo_navigation_integration_test.cjs' 'Tests/player_home_links_database_test.sql' 'Tests/player_home_onboarding_test.cjs' 'Tests/saved_social_deletion_database_test.sql' 'Tests/signup_entry_flow_test.cjs' 'Tests/social_large_photo_test.cjs' 'Tests/social_storage_delete_test.mjs' 'app-start.js' 'app.html' 'app.js' 'demo.html' 'player-of-week-demo.js' 'social-awards.js' 'social-publishing.js' 'social-workspace.js' 'supabase/migrations/20261029102232_player_home_and_social_storage_301.sql' 'supabase/migrations/20261029102549_social_history_delete_scope_301.sql' 'team-of-week-demo.js'
          git rm .github/release-player-home-301.patch.gz.b64 .github/workflows/release-player-home-301.yml
          test "$(git write-tree)" = "7d12184b8c53a11c4606d22471f3fe8428c0626b"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Apply verified player Home and social storage update"
          git push origin HEAD:${{ github.ref_name }}
