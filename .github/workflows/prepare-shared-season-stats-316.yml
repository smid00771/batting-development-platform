name: Prepare shared Season stats 316
on:
  push:
    branches: [codex/shared-season-stats-316]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    env:
      TZ: UTC
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/shared-season-stats-316
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply reviewed implementation
        run: base64 --decode .github/shared-season-stats-316.patch.gz.b64 | gzip -d | git apply --binary
      - name: Verify syntax and demo freshness
        run: |
          node --check app.js
          node --check app-start.js
          node --check season-stats-panel.js
          node --check season-stats-demo.js
          node --check playcricket-team.js
          node --check Demo/fixtures.js
          node Scripts/build-demo.mjs --check
          cmp Database/shared_season_stats.sql supabase/migrations/20261031073610_shared_season_stats.sql
          cmp Database/scorecard_official_names.sql supabase/migrations/20261031075257_scorecard_official_names.sql
          git diff --check
      - name: Install verification dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify shared stats and player identity confirmation
        run: node --test --test-force-exit Tests/shared_season_stats_demo_test.cjs Tests/season_stats_ui_test.cjs Tests/season_stats_test.mjs Tests/playcricket_team_ui_test.mjs
      - name: Commit exactly the reviewed tree
        run: |
          git add AGENTS.md Database/scorecard_official_names.sql Database/shared_season_stats.sql Demo/build-manifest.json Demo/fixtures.js Reviews/2026-10-31-shared-season-stats-316.md Reviews/assets/stats-316-desktop.jpg Reviews/assets/stats-316-more.jpg Reviews/assets/stats-316-phone.jpg Tests/playcricket_team_ui_test.mjs Tests/season_stats_database_test.sql Tests/season_stats_test.mjs Tests/season_stats_ui_test.cjs Tests/selection_only_scorecard_identity_test.sql Tests/shared_season_stats_demo_test.cjs Tests/shared_season_stats_live_test.sql app-start.js app.html app.js demo.html playcricket-team.js season-stats-demo.js season-stats-panel.js supabase/migrations/20261031073610_shared_season_stats.sql supabase/migrations/20261031075257_scorecard_official_names.sql
          git rm .github/shared-season-stats-316.patch.gz.b64 .github/workflows/prepare-shared-season-stats-316.yml
          git diff --cached --check
          test "$(git write-tree)" = "8a853aee9e350dcae474e24ed3224f8d8dd9a011"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Restore shared Season stats and confirmed PlayHQ names (.316)'
          git push origin HEAD:codex/shared-season-stats-316
