name: Verify results template release
on:
  push:
    branches: [codex/results-template-290]
    paths:
      - '.github/release-results-template-290.patch.gz.b64'
      - '.github/workflows/release-results-template-290.yml'
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply reviewed source
        run: |
          base64 --decode .github/release-results-template-290.patch.gz.b64 | gzip --decompress > /tmp/results-template-290.patch
          git apply --check /tmp/results-template-290.patch
          git apply /tmp/results-template-290.patch
          node --check social-awards.js
          node --check social-awards-model.js
          node --check social-award-fonts.js
          node --check Functions/club-social-style/award-refine.mjs
          node --check Functions/playhq-sync/result-margin.mjs
          node Scripts/build-demo.mjs
          node Scripts/build-demo.mjs --check
      - name: Install pinned test dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify rendered graphics, import safety and existing workflows
        run: node --test Tests/social_award_fonts_test.mjs Tests/social_results_template_test.mjs Tests/playhq_result_margin_test.mjs Tests/social_awards_refine_service_test.mjs Tests/social_awards_refinement_test.mjs Tests/social_results_wording_test.mjs Tests/social_results_outcomes_test.mjs Tests/social_results_logos_test.mjs Tests/social_awards_ui_test.mjs Tests/social_awards_recovery_test.mjs Tests/social_graphic_assistant_test.mjs Tests/social_team_reference_test.mjs Tests/team_of_week_ui_test.mjs Tests/player_of_week_ui_test.mjs Tests/team_week_figure_assistant_test.mjs Tests/social_team_workflow_test.mjs Tests/social_award_labels_test.mjs Tests/social_award_scopes_test.mjs Tests/social_prepare_service_test.cjs Tests/social_preparation_iteration_test.cjs Tests/social_guide_flow_test.cjs Tests/app_startup_test.cjs Tests/demo_navigation_integration_test.cjs Tests/demo_roles_integration_test.cjs Tests/selection_analysis_on_demand_test.cjs Tests/playhq_shared_scorecard_test.mjs Tests/playhq_linked_scorecard_test.mjs Tests/playhq_edge_test.mjs Tests/playhq_public_api_test.mjs
      - name: Commit the exact tested release
        run: |
          git add AGENTS.md Demo/build-manifest.json Demo/current-fixtures.js Functions/club-social-style/README.md Functions/club-social-style/award-refine.mjs Functions/playhq-sync/README.md Functions/playhq-sync/result-margin.mjs Functions/playhq-sync/shared-scorecard.mjs Reviews/2026-10-28-results-template-290.md Tests/app_startup_test.cjs Tests/playhq_result_margin_test.mjs Tests/social_award_fonts_test.mjs Tests/social_awards_refine_service_test.mjs Tests/social_awards_refinement_test.mjs Tests/social_awards_ui_test.mjs Tests/social_results_template_test.mjs app-start.js app.html app.js assets/font-licenses/Club-Brush-OFL.txt assets/font-licenses/Club-Display-OFL.txt assets/font-licenses/Club-Sans-OFL.txt assets/font-licenses/README.md demo.html social-award-font-data.js social-award-fonts.js social-awards-design.js social-awards-model.js social-awards.js
          git rm .github/release-results-template-290.patch.gz.b64 .github/workflows/release-results-template-290.yml
          git diff --cached --check
          test "$(git write-tree)" = "b1c47f924455d0d53d2136be0f8ff77a5f40aaf6"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Verify and prepare results template release 0.8.62.290"
          git push origin HEAD:codex/results-template-290
