name: Verify Selection Board responsiveness 285
on:
  push:
    branches: [codex/selection-board-responsive-285]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Apply and verify tested release
        shell: bash
        run: |
          set -euo pipefail
          git apply --check .github/release-board-responsive-285.patch
          git apply .github/release-board-responsive-285.patch
          node --check app.js
          node --check Scripts/benchmark-selection-board.cjs
          node Scripts/build-demo.mjs
          node Scripts/build-demo.mjs --check
          npm ci --ignore-scripts --no-audit --no-fund
          node --test Tests/selection_board_responsiveness_test.cjs Tests/selection_emergency_ui_test.cjs Tests/selection_team_moves_test.cjs Tests/selection_meeting_ui_test.cjs Tests/selection_room_scope_test.cjs Tests/selection_room_recovery_test.mjs
          node Tests/selection_room_ui_test.mjs
          node Tests/selection_chat_sessions_ui_test.mjs
          node --test --test-name-pattern='the complete demo opens on the selector board' Tests/demo_navigation_integration_test.cjs
          git add Database/selection_board_context.sql Demo/build-manifest.json Reviews/2026-10-27-selection-board-responsive-285.md Scripts/benchmark-selection-board.cjs Tests/selection_board_context_database_test.sql Tests/selection_board_responsiveness_test.cjs app.html app.js demo.html supabase/migrations/20261027120834_skip_unused_board_review_snapshots.sql
          git rm .github/release-board-responsive-285.patch .github/workflows/release-board-responsive-285.yml
          git diff --cached --check
          test "$(git write-tree)" = "a040721d1b2456874293abd436e5b2214fc0207f"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Build verified board responsiveness release 0.8.62.285"
          git push origin HEAD:refs/heads/codex/selection-board-responsive-285
