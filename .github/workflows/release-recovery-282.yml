name: Verify emergency selection recovery
on:
  push:
    branches: [codex/selection-emergency-282]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Apply and verify tested release
        shell: bash
        run: |
          set -euo pipefail
          git apply --check .github/release-recovery-282.patch
          git apply .github/release-recovery-282.patch
          node --check app.js
          node Scripts/build-demo.mjs
          node Scripts/build-demo.mjs --check
          npm ci --ignore-scripts --no-audit --no-fund
          node --test Tests/selection_emergency_ui_test.cjs Tests/selection_team_moves_test.cjs Tests/selection_team_moves_demo_test.cjs Tests/availability_preserve_test.cjs Tests/availability_calendar_test.cjs Tests/selection_availability_return_test.cjs Tests/team_publication_ui_test.mjs
          git add app.js app.html demo.html Demo/build-manifest.json Tests/selection_emergency_ui_test.cjs Tests/selection_emergency_database_test.sql supabase/migrations/20261027100920_pause_selection_background_analysis.sql supabase/migrations/20261027101534_stop_selection_access_background_sync.sql
          git rm .github/release-recovery-282.patch .github/workflows/release-recovery-282.yml
          git diff --cached --check
          test "$(git write-tree)" = "50cd15c8834e2827e616376631c756fba75eeace"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Build verified selection recovery and extra options (282)"
          git push origin HEAD:refs/heads/codex/selection-emergency-282
