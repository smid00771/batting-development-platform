name: Verify predictions load on request
on:
  push:
    branches: [codex/prediction-startup-296]
    paths: [.github/release-prediction-296.patch.gz.b64, .github/workflows/release-prediction-296.yml]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply prepared source
        run: |
          base64 -d .github/release-prediction-296.patch.gz.b64 | gzip -d > /tmp/prediction-296.patch
          git apply /tmp/prediction-296.patch
          node --check app.js
          node --check prediction-workspace.js
          node --check prediction-preparation.js
          node Scripts/build-demo.mjs
          node Scripts/build-demo.mjs --check
          git diff --check
      - name: Verify prediction and app regressions
        run: |
          npm ci --ignore-scripts
          node --test Tests/prediction_loading_test.cjs Tests/app_startup_test.cjs Tests/innings_loading_safety_test.cjs Tests/navigation_precision_test.cjs Tests/demo_navigation_integration_test.cjs Tests/demo_roles_integration_test.cjs Tests/selection_analysis_on_demand_test.cjs Tests/social_loading_test.cjs
      - name: Commit verified release
        run: |
          git config user.name "Mirelion release verification"
          git config user.email "actions@users.noreply.github.com"
          git add 'AGENTS.md' 'Demo/build-manifest.json' 'Demo/fixtures.js' 'Reviews/2026-10-29-prediction-startup-296.md' 'Tests/app_startup_test.cjs' 'Tests/helpers/demo_harness.cjs' 'Tests/navigation_precision_test.cjs' 'Tests/prediction_loading_test.cjs' 'app-start.js' 'app.html' 'app.js' 'demo.html' 'prediction-preparation.js' 'prediction-workspace.js'
          git rm .github/release-prediction-296.patch.gz.b64 .github/workflows/release-prediction-296.yml
          test "$(git write-tree)" = "003b5d6e84230d2dfa6813c9487d099a4f41a5f7"
          git commit -m "Verify predictions load on request 0.8.62.296"
          git push origin HEAD:codex/prediction-startup-296
