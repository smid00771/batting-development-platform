name: Verify and prepare availability player search 308
on:
  push:
    branches: [codex/availability-player-search-308]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/availability-player-search-308
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply reviewed implementation
        run: base64 --decode .github/release-availability-308.patch.gz.b64 | gzip -d | git apply --binary
      - run: npm ci --ignore-scripts
      - name: Verify the shared app and demo
        run: |
          node --check app.js
          node --check app-start.js
          node Scripts/build-demo.mjs --check
          node --test Tests/availability_player_search_test.cjs Tests/availability_preserve_test.cjs Tests/availability_calendar_test.cjs Tests/selection_availability_return_test.cjs
          npm run test:demo
      - name: Commit exactly the reviewed tree
        run: |
          git add AGENTS.md Demo/build-manifest.json Reviews/2026-10-30-availability-player-search-308.md Reviews/assets/availability-bulk-desktop-308.jpg Reviews/assets/availability-bulk-phone-308.jpg Reviews/assets/availability-search-phone-308.jpg Tests/availability_player_search_test.cjs Tests/availability_preserve_test.cjs app-start.js app.html app.js demo.html
          git rm .github/release-availability-308.patch.gz.b64 .github/workflows/prepare-availability-308.yml
          test "$(git write-tree)" = "3f2c25d91170202a546524ff95e30329f2467c03"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Make availability players searchable and expand the checklist (.308)'
          git push origin HEAD:codex/availability-player-search-308
