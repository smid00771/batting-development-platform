name: Build tested returning player controls
on:
  push:
    branches: [codex/compact-returning-278]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Build and verify the tested release tree
        shell: bash
        run: |
          set -euo pipefail
          git apply --check .github/release-returning-278.patch
          git apply .github/release-returning-278.patch
          node --check app.js
          node --check selection-returning.js
          node --check selection-evidence-ui.js
          node --check selection-history.js
          node Scripts/build-demo.mjs
          node Scripts/build-demo.mjs --check
          git add app.js Demo/fixtures.js demo.html Demo/build-manifest.json
          git rm .github/workflows/release-returning-278.yml .github/release-returning-278.patch
          git diff --cached --check
          test "$(git write-tree)" = "5b781286a00e72195023276317dede1183e3d757"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Build verified app and demo for release 278"
          git push origin HEAD:refs/heads/codex/compact-returning-278
