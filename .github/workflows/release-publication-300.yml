name: Release publication validation 300
on:
  push:
    branches: [codex/publication-validation-300]
    paths: ['.github/release-publication-300.patch.gz.b64', '.github/workflows/release-publication-300.yml']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/publication-validation-300
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply reviewed source and validate
        run: |
          base64 --decode .github/release-publication-300.patch.gz.b64 | gzip --decompress | git apply --binary
          npm ci --ignore-scripts
          node --check app.js
          node --check app-start.js
          node Scripts/build-demo.mjs
          node Scripts/build-demo.mjs --check
          node --test Tests/publication_validation_demo_test.cjs Tests/selection_match_roles_ui_test.cjs Tests/selection_team_moves_demo_test.cjs Tests/selection_analysis_on_demand_test.cjs Tests/selection_returning_quiet_test.cjs
          git diff --check
          git add AGENTS.md Database/publication_check.sql Demo/build-manifest.json Demo/current-fixtures.js Demo/fixtures.js Reviews/2026-10-29-publication-validation-300.md Tests/publication_validation_database_test.sql Tests/publication_validation_demo_test.cjs Tests/selection_team_moves_demo_test.cjs app-start.js app.html app.js demo.html supabase/migrations/20261029093235_publication_validation_keeper_warning.sql
          git rm .github/release-publication-300.patch.gz.b64 .github/workflows/release-publication-300.yml
          test "$(git write-tree)" = "8eb9eb96fab2dac082792fd57c69ff188c494dbb"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Apply reviewed publication validation and keeper warning 300"
          git push origin HEAD:codex/publication-validation-300
