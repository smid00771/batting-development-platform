name: Verify Mirelion support automation
on:
  push:
    branches: [codex/assist-automation-295]
    paths: [.github/release-assist-295.patch.gz.b64, .github/workflows/release-assist-295.yml]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply prepared source
        run: |
          base64 -d .github/release-assist-295.patch.gz.b64 | gzip -d > /tmp/assist-295.patch
          git apply /tmp/assist-295.patch
          node --check app.js
          node --check mirelion-assist.js
          node --check Functions/mirelion-support/worker.mjs
          node Scripts/build-demo.mjs
          node Scripts/build-demo.mjs --check
          git diff --check
      - name: Verify support and app regressions
        run: |
          npm ci --ignore-scripts
          npm install --ignore-scripts --prefix /tmp/support-db @electric-sql/pglite@0.5.12
          node --test Tests/mirelion_support_test.mjs Tests/mirelion_assist_ui_test.cjs Tests/mirelion_assist_demo_test.cjs Tests/assist_entry_flow_test.cjs Tests/assist_email_test.mjs Tests/assist_dispatcher_test.cjs Tests/app_startup_test.cjs Tests/demo_navigation_integration_test.cjs Tests/demo_roles_integration_test.cjs Tests/selection_analysis_on_demand_test.cjs Tests/social_loading_test.cjs
          NODE_PATH=/tmp/support-db/node_modules node Tests/mirelion_support_database_test.cjs
      - name: Commit verified release
        run: |
          git config user.name "Mirelion release verification"
          git config user.email "actions@users.noreply.github.com"
          git add 'AGENTS.md' 'Database/mirelion_support_automation.sql' 'Demo/build-manifest.json' 'Functions/mirelion-support/README.md' 'Functions/mirelion-support/assistant.mjs' 'Functions/mirelion-support/email.mjs' 'Functions/mirelion-support/index.ts' 'Functions/mirelion-support/knowledge.mjs' 'Functions/mirelion-support/worker.mjs' 'Reviews/2026-10-28-assist-automation-295.md' 'Tests/assist_entry_flow_test.cjs' 'Tests/mirelion_assist_ui_test.cjs' 'Tests/mirelion_support_database_test.cjs' 'Tests/mirelion_support_live_test.sql' 'Tests/mirelion_support_test.mjs' 'app-start.js' 'app.html' 'app.js' 'demo.html' 'mirelion-assist-demo.js' 'mirelion-assist.js' 'privacy.html' 'supabase/migrations/20261028111054_mirelion_support_automation.sql'
          git rm .github/release-assist-295.patch.gz.b64 .github/workflows/release-assist-295.yml
          test "$(git write-tree)" = "66fa174576651400488a0b422656db6f947b2bc8"
          git commit -m "Verify Mirelion support automation 0.8.62.295"
          git push origin HEAD:codex/assist-automation-295
