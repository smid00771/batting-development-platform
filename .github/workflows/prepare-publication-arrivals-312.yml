name: Prepare verified publication and arrivals 312
on:
  push:
    branches: [codex/selective-team-publication-312]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/selective-team-publication-312
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply reviewed implementation
        run: base64 --decode .github/publication-arrivals-312.patch.gz.b64 | gzip -d | git apply --binary
      - name: Verify syntax and demo freshness
        run: |
          node --check app.js
          node --check app-start.js
          node --check match-arrivals.js
          node Scripts/build-demo.mjs --check
          git diff --check
      - name: Install verification dependencies
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm install --prefix /tmp/mirelion-db-tests --no-audit --no-fund --ignore-scripts @electric-sql/pglite@0.5.12
      - name: Verify publication, arrivals, permissions and retry
        run: |
          node --test Tests/match_arrivals_demo_test.cjs Tests/match_review_home_test.cjs Tests/coaching_observation_safety_test.cjs Tests/publication_validation_demo_test.cjs Tests/selection_groups_board_test.cjs
          node --test --test-name-pattern='each role opens|group grants distinguish' Tests/demo_roles_integration_test.cjs
          NODE_PATH=/tmp/mirelion-db-tests/node_modules node --test Tests/match_arrivals_database_test.cjs Tests/publication_recipients_database_test.cjs
      - name: Commit exactly the reviewed tree
        run: |
          git add AGENTS.md Database/selective_publication_notifications.sql Database/shared_match_arrivals.sql Demo/build-manifest.json Demo/current-fixtures.js Demo/fixtures.js Reviews/2026-10-31-publication-arrivals-312.md Reviews/assets/arrivals-312-desktop.jpg Reviews/assets/arrivals-312-phone.jpg Reviews/assets/publication-312-desktop.jpg Reviews/assets/publication-312-phone.jpg Tests/coaching_observation_safety_test.cjs Tests/match_arrivals_database_test.cjs Tests/match_arrivals_demo_test.cjs Tests/publication_arrivals_live_test.sql Tests/publication_recipients_database_test.cjs Tests/publication_validation_demo_test.cjs app-start.js app.html app.js demo.html match-arrivals.js supabase/migrations/20261030224433_selective_publication_notifications.sql supabase/migrations/20261030224448_shared_match_arrivals.sql
          git rm .github/publication-arrivals-312.patch.gz.b64 .github/workflows/prepare-publication-arrivals-312.yml
          test "$(git write-tree)" = "b2fc9a4e0a7ff306cfa065aba2856fc697935106"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Publish chosen teams, notify affected players and share late arrivals (.312)'
          git push origin HEAD:codex/selective-team-publication-312
