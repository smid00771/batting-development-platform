name: Prepare observation videos 315
on:
  push:
    branches: [codex/observation-videos-315]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    env:
      TZ: UTC
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/observation-videos-315
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply reviewed implementation
        run: base64 --decode .github/observation-videos-315.patch.gz.b64 | gzip -d | git apply --binary
      - name: Verify syntax and demo freshness
        run: |
          node --check app.js
          node --check app-start.js
          node --check Demo/fixtures.js
          node Scripts/build-demo.mjs --check
          cmp Database/observation_video_links.sql supabase/migrations/20261031071224_observation_video_links.sql
          git diff --check
      - name: Install verification dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify video contributions and safe retry
        run: node --test Tests/observation_videos_demo_test.cjs Tests/observation_fixtures_demo_test.cjs Tests/coaching_observation_safety_test.cjs Tests/coaching_feedback_flow_test.cjs
      - name: Commit exactly the reviewed tree
        run: |
          git add AGENTS.md Database/observation_video_links.sql Demo/build-manifest.json Demo/fixtures.js Reviews/2026-10-31-observation-videos-315.md Reviews/assets/observation-videos-315-desktop.jpg Reviews/assets/observation-videos-315-phone.jpg Tests/coaching_feedback_flow_test.cjs Tests/observation_videos_demo_test.cjs Tests/observation_videos_live_test.sql app-start.js app.html app.js demo.html supabase/migrations/20261031071224_observation_video_links.sql
          git rm .github/observation-videos-315.patch.gz.b64 .github/workflows/prepare-observation-videos-315.yml
          git diff --cached --check
          test "$(git write-tree)" = "d5502de9fd1c4af5a0def8f524fc38624b12c999"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Add multiple Match Observation clips and clearer actions (.315)'
          git push origin HEAD:codex/observation-videos-315
