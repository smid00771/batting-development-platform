name: Build tested password flow
on:
  push:
    branches: [codex/password-flow-280]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Build and verify tested release tree
        shell: bash
        run: |
          set -euo pipefail
          git apply --check .github/release-auth-280.patch
          git apply .github/release-auth-280.patch
          node --check app.js
          node --check password-flow.js
          node Scripts/build-demo.mjs
          node Scripts/build-demo.mjs --check
          npm ci --ignore-scripts --no-audit --no-fund
          node --test Tests/password_flow_test.mjs Tests/password_entry_ui_test.cjs Tests/signup_entry_flow_test.cjs Tests/people_signup_recovery_test.cjs Tests/domain_routing_test.mjs Tests/domain_integrations_test.mjs
          git add app.js demo.html Demo/build-manifest.json
          git rm .github/workflows/release-auth-280.yml .github/release-auth-280.patch
          git diff --cached --check
          test "$(git write-tree)" = "952357b244ea134e727db47a2e179983818b40e2"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Build verified app and demo for release 280"
          git push origin HEAD:refs/heads/codex/password-flow-280
