name: Build tested return comparisons
on:
  push:
    branches: [codex/visible-returning-bowling-277]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Build and verify the tested release tree
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app.js')
          source = p.read_text()
          assert source.count('0.8.62.276') == 3
          p.write_text(source.replace('0.8.62.276', '0.8.62.277'))
          PY
          node --check app.js
          node --check selection-returning.js
          node --check selection-evidence-ui.js
          node Scripts/build-demo.mjs
          node Scripts/build-demo.mjs --check
          git add app.js demo.html Demo/build-manifest.json
          git rm .github/workflows/release-returning-277.yml
          git diff --cached --check
          test "$(git write-tree)" = "2817c6fc5f60aea18800d2f9d43cce35b73bcf35"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Build verified app and demo for release 277"
          git push origin HEAD:refs/heads/codex/visible-returning-bowling-277
