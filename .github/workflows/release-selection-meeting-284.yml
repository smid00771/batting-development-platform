name: Verify selection meeting 284
on:
  push:
    branches: [codex/selection-meeting-284]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Apply and verify tested release
        shell: bash
        run: |
          set -euo pipefail
          git apply --check .github/release-selection-meeting-284.patch
          git apply .github/release-selection-meeting-284.patch
          node --check app.js
          node --check selection-room.js
          node Scripts/build-demo.mjs
          node Scripts/build-demo.mjs --check
          npm ci --ignore-scripts --no-audit --no-fund
          node --test Tests/selection_meeting_ui_test.cjs Tests/selection_room_recovery_test.mjs Tests/selection_room_scope_test.cjs Tests/selection_emergency_ui_test.cjs Tests/selection_team_moves_test.cjs
          node Tests/selection_room_ui_test.mjs
          node Tests/selection_chat_sessions_ui_test.mjs
          node --test --test-name-pattern='the complete demo opens on the selector board' Tests/demo_navigation_integration_test.cjs
          git add AGENTS.md Database/selection_meeting.sql Database/selection_meeting_analysis_guard.sql Database/selection_meeting_board_context.sql Demo/build-manifest.json Demo/fixtures.js Reviews/2026-10-27-selection-meeting-284.md Tests/demo_navigation_integration_test.cjs Tests/selection_meeting_database_test.sql Tests/selection_meeting_ui_test.cjs Tests/selection_room_recovery_test.mjs Tests/selection_room_scope_test.cjs Tests/selection_room_ui_test.mjs app.html app.js demo.html selection-room.js supabase/migrations/20261027112952_selection_meeting_and_read_only_chat.sql supabase/migrations/20261027113402_pause_season_analysis_during_meetings.sql supabase/migrations/20261027113752_selection_meeting_in_board_context.sql
          git rm .github/release-selection-meeting-284.patch .github/workflows/release-selection-meeting-284.yml
          git diff --cached --check
          test "$(git write-tree)" = "7705b9e0290e6c217f00938efc1302368f54e593"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Build verified selection meeting release 0.8.62.284"
          git push origin HEAD:refs/heads/codex/selection-meeting-284
