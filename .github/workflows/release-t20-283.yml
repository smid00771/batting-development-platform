name: Verify consecutive T20 selection slots
on:
  push:
    branches: [codex/t20-selection-slots-283]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Apply and verify tested release
        shell: bash
        run: |
          set -euo pipefail
          git apply --check .github/release-t20-283.patch
          git apply .github/release-t20-283.patch
          node --check app.js
          node Scripts/build-demo.mjs
          node Scripts/build-demo.mjs --check
          npm ci --ignore-scripts --no-audit --no-fund
          node --test Tests/selection_team_moves_test.cjs Tests/selection_team_moves_demo_test.cjs Tests/selection_emergency_ui_test.cjs
          git add app.js app.html demo.html Demo/build-manifest.json Tests/selection_team_moves_test.cjs Tests/selection_same_day_games_database_test.sql supabase/migrations/20261027110512_three_hour_t20_selection_windows.sql
          git rm .github/release-t20-283.patch .github/workflows/release-t20-283.yml
          git diff --cached --check
          test "$(git write-tree)" = "0cc8a4bdcf14fef919bbaaae44278291af493f27"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Build verified consecutive T20 slots (283)"
          git push origin HEAD:refs/heads/codex/t20-selection-slots-283
