name: Prepare verified Club Home overview 311
on:
  push:
    branches: [codex/club-home-progress-311]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/club-home-progress-311
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply reviewed implementation
        run: base64 --decode .github/club-home-311.patch.gz.b64 | gzip -d | git apply --binary
      - name: Verify syntax and generated demo
        run: |
          node --check app.js
          node --check app-start.js
          node Scripts/build-demo.mjs --check
          git diff --check
      - name: Commit exactly the reviewed tree
        run: |
          git add AGENTS.md Demo/build-manifest.json Reviews/2026-10-30-club-home-progress-311.md Reviews/assets/club-home-311-desktop.jpg Reviews/assets/club-home-311-phone.jpg app-start.js app.html app.js demo.html
          git rm .github/club-home-311.patch.gz.b64 .github/workflows/prepare-club-home-311.yml
          test "$(git write-tree)" = "b823d73f6ddd219bc6d19979ea461465788e579c"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Show completed Club Home progress tiles by default (.311)'
          git push origin HEAD:codex/club-home-progress-311
