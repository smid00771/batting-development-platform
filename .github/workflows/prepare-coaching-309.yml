name: Verify and prepare coaching and player workflows 309
on:
  push:
    branches: [codex/coaching-inbox-309]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/coaching-inbox-309
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply reviewed implementation
        run: base64 --decode .github/release-coaching-309.patch.gz.b64 | gzip -d | git apply --binary
      - run: npm ci --ignore-scripts
      - run: npm install --prefix /tmp/mirelion-db-tests --no-audit --no-fund --ignore-scripts @electric-sql/pglite@0.5.12
      - name: Verify database and interface workflows
        env:
          NODE_PATH: /tmp/mirelion-db-tests/node_modules
        run: |
          node --check app.js
          node --check app-start.js
          node Scripts/build-demo.mjs --check
          git diff --check
          node --test Tests/shared_account_claims_test.cjs Tests/completed_scorecard_match_review_test.cjs Tests/assigned_coaching_messages_test.cjs Tests/player_signup_status_test.cjs
          node --test Tests/coaching_inbox_test.cjs Tests/message_recipients_test.cjs Tests/review_scorecard_rows_test.cjs Tests/scorecard_identity_ui_test.cjs Tests/match_scorecard_input_test.cjs Tests/coaching_feedback_flow_test.cjs Tests/coaching_observation_safety_test.cjs Tests/navigation_precision_test.cjs Tests/app_startup_test.cjs
          npm run test:demo
      - name: Commit exactly the reviewed tree
        run: |
          git add AGENTS.md Database/assigned_coaching_messages.sql Database/completed_scorecard_match_review.sql Database/player_signup_status.sql Database/shared_account_claims.sql Demo/build-manifest.json Demo/fixtures.js Reviews/2026-10-30-coaching-accounts-messages-309.md Reviews/assets/coaching-conversation-phone-309.jpg Reviews/assets/message-recipients-desktop-309.jpg Reviews/assets/message-recipients-phone-309.jpg Tests/assigned_coaching_messages_test.cjs Tests/coaching_feedback_flow_test.cjs Tests/coaching_inbox_test.cjs Tests/completed_scorecard_match_review_test.cjs Tests/fixtures/shared_account_claims_baseline.sql Tests/message_recipients_test.cjs Tests/player_signup_status_test.cjs Tests/review_scorecard_rows_test.cjs Tests/scorecard_identity_ui_test.cjs Tests/shared_account_claims_test.cjs app-start.js app.html app.js demo.html supabase/migrations/20261030070337_shared_account_claims.sql supabase/migrations/20261030070849_completed_scorecard_match_review.sql supabase/migrations/20261030071324_assigned_coaching_messages.sql supabase/migrations/20261030071627_player_signup_status.sql
          git rm .github/release-coaching-309.patch.gz.b64 .github/workflows/prepare-coaching-309.yml
          test "$(git write-tree)" = "47b80fd018731994e727102ddfbbd8a104187d57"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Route coaching messages and repair shared player workflows (.309)'
          git push origin HEAD:codex/coaching-inbox-309
