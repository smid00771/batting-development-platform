name: Verify paused selection analysis
on:
  push:
    branches: [codex/selection-speed-281]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Apply and verify tested release
        shell: bash
        run: |
          set -euo pipefail
          git apply --check .github/release-speed-281.patch
          git apply .github/release-speed-281.patch
          node --check app.js
          node --check selection-evidence-ui.js
          node Scripts/build-demo.mjs
          node Scripts/build-demo.mjs --check
          npm ci --ignore-scripts --no-audit --no-fund
          node --test Tests/selection_evidence_ui_test.cjs Tests/selection_team_moves_test.cjs Tests/selection_team_moves_demo_test.cjs
          git add app.js app.html selection-evidence-ui.js Tests/selection_evidence_ui_test.cjs Tests/selection_team_moves_test.cjs demo.html Demo/build-manifest.json
          git rm .github/release-speed-281.patch .github/workflows/release-speed-281.yml
          git diff --cached --check
          test "$(git write-tree)" = "d86868032132e43141865a523a6a7eb68e526127"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Build verified selection pause release 281"
          git push origin HEAD:refs/heads/codex/selection-speed-281
