name: Apply and verify results example 289
on:
  push:
    branches: [codex/results-wording-289]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply exact reviewed changes and verify
        run: |
          set -euo pipefail
          base64 -d .github/release-results-wording-289.patch.gz.b64 | gzip -d > /tmp/results-289.patch
          git apply --check /tmp/results-289.patch
          git apply /tmp/results-289.patch
          node --check social-awards.js
          node --check social-awards-design.js
          node --check social-awards-model.js
          node --check app.js
          node --check app-start.js
          node --check Functions/club-social-style/award-refine.mjs
          node Scripts/build-demo.mjs
          node Scripts/build-demo.mjs --check
          npm ci --ignore-scripts --no-audit --no-fund
          node --test Tests/social_awards_refine_service_test.mjs Tests/social_awards_refinement_test.mjs Tests/social_results_wording_test.mjs Tests/social_results_outcomes_test.mjs Tests/social_results_logos_test.mjs Tests/social_awards_ui_test.mjs Tests/social_awards_recovery_test.mjs Tests/social_graphic_assistant_test.mjs Tests/social_team_reference_test.mjs Tests/team_of_week_ui_test.mjs Tests/player_of_week_ui_test.mjs Tests/team_week_figure_assistant_test.mjs Tests/social_team_workflow_test.mjs Tests/social_award_labels_test.mjs Tests/social_award_scopes_test.mjs Tests/social_prepare_service_test.cjs Tests/social_preparation_iteration_test.cjs Tests/social_guide_flow_test.cjs Tests/app_startup_test.cjs Tests/demo_navigation_integration_test.cjs Tests/demo_roles_integration_test.cjs Tests/selection_analysis_on_demand_test.cjs
          git add -- AGENTS.md Demo/build-manifest.json Demo/current-fixtures.js Functions/club-social-style/README.md Functions/club-social-style/award-refine.mjs Reviews/2026-10-28-results-example-289.md Tests/app_startup_test.cjs Tests/player_of_week_ui_test.mjs Tests/social_awards_recovery_test.mjs Tests/social_awards_refine_service_test.mjs Tests/social_awards_refinement_test.mjs Tests/social_awards_ui_test.mjs Tests/social_graphic_assistant_test.mjs Tests/social_results_logos_test.mjs Tests/social_results_wording_test.mjs Tests/social_team_reference_test.mjs Tests/team_of_week_ui_test.mjs Tests/team_week_figure_assistant_test.mjs app-start.js app.html app.js demo.html package-lock.json package.json social-awards-design.js social-awards-model.js social-awards.js
          git rm -- .github/release-results-wording-289.patch.gz.b64 .github/workflows/release-results-wording-289.yml
          git diff --cached --check
          test "$(git write-tree)" = "9b85365c64ce0cdd70784a4acb1c23a666859dcf"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Match previous examples and apply paired result wording consistently"
          git push origin HEAD:codex/results-wording-289
