name: Verify and prepare fixture calendars and plan reminders 306
on:
  push:
    branches: [codex/fixtures-and-plan-reminders-306]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/fixtures-and-plan-reminders-306
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply reviewed implementation
        run: base64 --decode .github/release-calendar-306.patch.gz.b64 | gzip -d | git apply --binary
      - run: npm ci --ignore-scripts
      - name: Install isolated database test runtime
        run: npm install --prefix "$RUNNER_TEMP/mirelion-db-qa" --no-save --ignore-scripts @electric-sql/pglite@0.5.10
      - name: Verify database and shared app
        run: |
          node --check app.js
          node --check availability-fixtures.js
          node --check fixture-calendar-trials.js
          node --check plan-reminder-settings.js
          node Scripts/build-demo.mjs --check
          NODE_PATH="$RUNNER_TEMP/mirelion-db-qa/node_modules" node --test Tests/availability_fixture_database_test.cjs Tests/selection_plan_dates_database_test.cjs
          node --test Tests/availability_fixture_finder_test.cjs Tests/plan_reminder_settings_test.cjs Tests/player_home_onboarding_test.cjs Tests/prediction_loading_test.cjs Tests/selection_availability_return_test.cjs Tests/availability_calendar_test.cjs Tests/assist_staff_loading_test.cjs Tests/mirelion_assist_demo_test.cjs
          npm run test:demo
      - name: Commit exactly the reviewed tree
        run: |
          git add AGENTS.md Database/availability_fixture_finder.sql Database/selection_plan_dates.sql Demo/build-manifest.json Demo/current-fixtures.js Reviews/2026-10-30-fixtures-and-plan-reminders-306.md Reviews/2026-10-30-player-phone-guidance-305.md Reviews/assets/calendar-phone-306.jpg Reviews/assets/fixture-details-phone-306.jpg Reviews/assets/plan-reminders-phone-306.jpg Reviews/assets/player-home-phone-305.jpg Tests/availability_calendar_test.cjs Tests/availability_fixture_database_test.cjs Tests/availability_fixture_finder_test.cjs Tests/fixtures/selection_plan_baseline.sql Tests/plan_reminder_settings_test.cjs Tests/player_home_onboarding_test.cjs Tests/prediction_loading_test.cjs Tests/selection_availability_return_test.cjs Tests/selection_plan_dates_database_test.cjs app-start.js app.html app.js availability-fixtures.js demo.html fixture-calendar-trials.js help-catalogue.js plan-reminder-settings.js supabase/migrations/20261030013011_availability_fixture_finder.sql supabase/migrations/20261030020523_selection_plan_dates.sql
          git rm .github/release-calendar-306.patch.gz.b64 .github/workflows/release-calendar-306.yml
          test "$(git write-tree)" = "a7b0096b8843c25a7f31d3602b5c3df086f6e179"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Add fixture calendars, club trials and automatic plan reminders'
          git push origin HEAD:codex/fixtures-and-plan-reminders-306
