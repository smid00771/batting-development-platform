name: Verify and prepare season-format plan reminders 307
on:
  push:
    branches: [codex/plan-reminders-usual-teams-307]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/plan-reminders-usual-teams-307
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply reviewed implementation
        run: base64 --decode .github/release-plan-reminders-307.patch.gz.b64 | gzip -d | git apply --binary
      - run: npm ci --ignore-scripts
      - name: Install isolated database test runtime
        run: npm install --prefix "$RUNNER_TEMP/mirelion-db-qa" --no-save --ignore-scripts @electric-sql/pglite@0.5.10
      - name: Verify database and shared app
        run: |
          node --check app.js
          node --check app-start.js
          node --check plan-reminder-settings.js
          node --check help-catalogue.js
          node --check Demo/current-fixtures.js
          cmp Database/season_format_plan_reminders.sql supabase/migrations/20261030030625_season_format_plan_reminders.sql
          node Scripts/build-demo.mjs --check
          NODE_PATH="$RUNNER_TEMP/mirelion-db-qa/node_modules" node --test Tests/season_format_plan_reminders_test.cjs Tests/selection_plan_dates_database_test.cjs
          node --test Tests/plan_reminder_settings_test.cjs Tests/player_home_onboarding_test.cjs Tests/availability_fixture_finder_test.cjs Tests/selection_availability_return_test.cjs Tests/availability_calendar_test.cjs
          npm run test:demo
      - name: Commit exactly the reviewed tree
        run: |
          git add AGENTS.md Database/season_format_plan_reminders.sql Demo/build-manifest.json Demo/current-fixtures.js Reviews/2026-10-30-fixtures-and-plan-reminders-306.md Reviews/2026-10-30-season-format-plan-reminders-307.md Reviews/assets/plan-reminders-phone-307.jpg Tests/helpers/plan_date_db.cjs Tests/plan_reminder_settings_test.cjs Tests/season_format_plan_reminders_test.cjs Tests/selection_plan_dates_database_test.cjs app-start.js app.html app.js demo.html help-catalogue.js plan-reminder-settings.js supabase/migrations/20261030030625_season_format_plan_reminders.sql
          git rm .github/release-plan-reminders-307.patch.gz.b64 .github/workflows/prepare-plan-reminders-307.yml
          test "$(git write-tree)" = "730af5639a8249b1b99eaa981897b03a0ff727d3"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Use season fixtures and normal teams for plan reminders (.307)'
          git push origin HEAD:codex/plan-reminders-usual-teams-307
