<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#173d32">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/svg+xml" href="./icons/mirelion.svg">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icons/mirelion-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Mirelion">
  <title>Mirelion — your club</title>
  <style>
    html{background:#f8f8f1;color:#173d32;font:16px/1.5 system-ui,sans-serif}body{margin:0}.app-start{min-height:100svh}.app-start header{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid #dce2d4}.app-start-mark{display:grid;place-items:center;width:34px;height:38px;border-radius:10px;background:#173d32;color:#f8f8f1;font-size:23px}.app-start-brand{font-size:20px;font-weight:700}.app-start main{max-width:1000px;margin:auto;padding:20px}.app-start p{margin:0 0 16px}.app-start-placeholder{height:120px;border:1px solid #e1e5da;border-radius:10px;background:#f0f2e8}.app-start button{min-height:44px;padding:8px 16px;font:inherit;border:1px solid #b5c1aa;border-radius:7px;background:#fff;color:#173d32;cursor:pointer}.app-start [hidden]{display:none}
  </style>
  <link rel="preload" as="style" href="./styles.css?v=0.8.62.251" onload="this.onload=null;this.rel='stylesheet'">
  <link rel="preload" as="style" href="./app-design.css?v=0.8.62.286" onload="this.onload=null;this.rel='stylesheet'">
  <link rel="preconnect" href="https://txrmgwoiowlqbuulmztd.supabase.co" crossorigin>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
</head>
<body>
  <div id="app"><section class="app-start" aria-label="Mirelion"><header><span class="app-start-mark" aria-hidden="true">M</span><span class="app-start-brand">Mirelion</span></header><main><p id="appStartStatus" role="status" aria-live="polite">Opening your club…</p><div class="app-start-placeholder" aria-hidden="true"></div><button id="appStartRetry" type="button" hidden onclick="location.reload()">Try again</button></main></section></div>
  <noscript>Mirelion needs JavaScript to sign in. <a href="./">Return to the Mirelion homepage</a>.</noscript>
  <script type="module" src="./app-start.js?v=0.8.62.294" onerror="document.getElementById('appStartStatus').textContent='Mirelion could not open. Check your connection and try again.';document.getElementById('appStartRetry').hidden=false"></script>
</body>
</html>
